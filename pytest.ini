[pytest]
testpaths =
    tests
    src/wuji_hand2_driver/test
    src/wuji_teleop_monitor/tests
    src/input_devices/manus_input/manus_ros2/tools/tests
python_files = test_*.py
# These ROS plugins eagerly import sibling *_test.py files during collection.
# Ordinary unit tests can still import ROS APIs without these launch collectors.
addopts = -p no:launch_testing -p no:launch_ros
norecursedirs =
    .*
    work build install log
    fetched retired deps vendor external third_party
    wuji-description ManusSDK retargeting wujihandros2

