# Chest Mount TF Configuration
# TF chain: chest -> {side}_chest_base (shared + rotation) -> {side}_chest (local)

chest_mount:
  # Shared translation (chest frame)
  shared:
    x: 0.0
    y: -0.2
    z: 0.12

  left:
    # Rotation (radians)
    roll: 1.5707963267948966
    pitch: 0.0
    yaw: -1.5707963267948966
    # Mirror-constrained neutral wrist offset (left_chest_base frame, m).
    local_x: -0.08225734761585848
    local_y: -0.05761710487083457
    local_z: 0.08307695821010537

  right:
    # Rotation (radians)
    roll: 1.5707963267948966
    pitch: 0.0
    yaw: 1.5707963267948966
    # Mirror-constrained neutral wrist offset (right_chest_base frame, m).
    local_x: -0.08225734761585848
    local_y: 0.05761710487083457
    local_z: 0.08307695821010537

# Wrist to Tianji TF: mirror-constrained neutral orientation fit to arm Home.
# Tracker-local offsets preserve subsequent world-frame rotation increments.
# Translation remains at the wrist origin.
wrist_to_tianji:
  left:
    x: 0.0
    y: 0.0
    z: 0.0
    qx: -0.05076668888251317
    qy: 0.7921934859809802
    qz: 0.23079726613530577
    qw: 0.5626587296165212

  right:
