# Chest Mount TF Configuration
# TF chain: chest -> {side}_chest_base (shared + rotation) -> {side}_chest (local)

chest_mount:
  # Shared translation (chest frame)
  shared:
    x: 0.0
    y: -0.2
    z: 0.12

  left:
    # Rotation (radians)
    roll: 1.5708
    pitch: 0.0
    yaw: -1.5708
    # Local translation (left_chest_base frame)
    local_x: 0.0
    local_y: 0.0
    local_z: 0.037

  right:
    roll: 1.5708
    pitch: 0.0
    yaw: 1.5708
    local_x: 0.0
    local_y: 0.0
    local_z: 0.037

# Wrist to Tianji TF for trackers mounted on the backs of the hands.
# Palm-down mounting: flange +Y points down on the left, -Y on the right.
# Post-multiply the original rotations by local Rz(-90 deg) / Rz(+90 deg).
# This preserves the target Z axis and translation.
wrist_to_tianji:
  left:
    x: 0.0
    y: 0.0
    z: 0.0
    qx: 0.0
    qy: 0.7071067811865476
    qz: 0.0
    qw: 0.7071067811865476

  right:
    x: 0.0
    y: 0.0
    z: 0.0
    qx: 0.0
    qy: -0.7071067811865476
    qz: 0.0
    qw: 0.7071067811865476
