name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Python and shell syntax
        run: |
          python3 -m compileall -q src tools
          bash -n tools/env.sh src/wuji_teleop_monitor/scripts/launcher.sh src/wuji_teleop_monitor/install_desktop.sh
